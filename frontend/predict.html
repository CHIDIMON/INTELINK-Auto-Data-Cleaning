<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Prediction Playground</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Sarabun:wght@300;400;600&display=swap"
        rel="stylesheet">

    <!-- ✅ เรียกใช้ CSS ส่วนกลาง -->
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>

    <style>
        /* สไตล์เสริมเพื่อให้เหมือนรูปที่ 2 เป๊ะๆ */
        body {
            background-color: #f8fafc;
        }

        .stat-value {
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            font-size: 2.5rem;
            color: #6366f1;
        }

        .card-modern {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .upload-area {
            border: 2px dashed #cbd5e1;
            border-radius: 16px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            background: #f1f5f9;
        }

        .upload-area:hover {
            border-color: #10b981;
            background: #f0fdf4;
        }
    </style>
</head>

<body class="py-4" data-page="predict">

    <div class="container" style="max-width: 1100px;">
        <!-- Header -->
        <div class="d-flex align-items-center mb-5">
            <a href="index.html"
                class="btn btn-light border shadow-sm rounded-circle me-3 d-flex align-items-center justify-content-center"
                style="width: 50px; height: 50px;">
                <i class="bi bi-arrow-left fs-5 text-dark"></i>
            </a>
            <div>
                <h2 class="fw-bold mb-0 text-dark brand-font"><i class="bi bi-magic text-warning me-2"></i>Prediction
                    Playground</h2>
                <p class="text-muted mb-0">Upload your trained model and test it with batch data or manual input.</p>
            </div>
        </div>

        <!-- Step 1: Upload Section -->
        <div class="card-modern p-4 mb-4">
            <h5 class="fw-bold mb-4 text-secondary"><i class="bi bi-cloud-arrow-up-fill me-2"></i>Step 1: Data & Model
                Selection</h5>
            <div class="row g-4">
                <div class="col-md-6">
                    <label class="form-label fw-bold text-primary">1. Model File (.pkl)</label>
                    <div class="upload-area h-100 d-flex flex-column justify-content-center align-items-center"
                        onclick="document.getElementById('modelFile').click()">
                        <i class="bi bi-box-seam fs-1 mb-2 text-primary"></i>
                        <p class="small text-muted mb-0 fw-bold" id="modelName">Select .pkl file</p>
                        <input type="file" id="modelFile" accept=".pkl" hidden
                            onchange="showName('modelFile', 'modelName')">
                    </div>
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-bold text-success">2. Reference Data (.csv)</label>
                    <div class="upload-area h-100 d-flex flex-column justify-content-center align-items-center"
                        onclick="document.getElementById('dataFile').click()">
                        <i class="bi bi-file-earmark-spreadsheet fs-1 mb-2 text-success"></i>
                        <p class="small text-muted mb-0 fw-bold" id="dataName">Select .csv file</p>
                        <input type="file" id="dataFile" accept=".csv" hidden
                            onchange="showName('dataFile', 'dataName')">
                    </div>
                </div>
            </div>

            <div class="mt-5 mb-2 px-3">
                <button onclick="predictBatch()" class="btn-ai shadow-sm py-3 fs-5" id="predictBtn">
                    <i class="bi bi-layers-fill me-2"></i>Generate Batch Predictions
                </button>
            </div>
        </div>

        <!-- Step 2: Manual Input Test -->
        <div class="card-modern p-4 mb-4 d-none" id="manualTestSection" style="border-left: 5px solid #10b981;">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="fw-bold mb-0 text-success"><i class="bi bi-keyboard-fill me-2"></i>Step 2: Manual Input
                    Testing</h5>
                <span class="badge bg-success-subtle text-success">Live Test</span>
            </div>

            <div id="targetSelectionWrapper" class="mb-4 bg-light p-3 rounded-3 border">
                <label class="form-label fw-bold text-dark"><i class="bi bi-crosshair text-danger me-1"></i> Select
                    Target Variable (Y) to Predict:</label>
                <select id="manualTargetColumn" class="form-select border-primary" onchange="generateManualForm()">
                    <option value="" disabled selected>-- Select Target Column --</option>
                </select>
            </div>

            <div id="dynamicFormWrapper" class="d-none">
                <div id="dynamicForm" class="row g-3 mb-4"></div>
                <button onclick="predictManual()" class="btn-manual w-100 py-3 fs-5" id="manualPredictBtn">
                    <i class="bi bi-play-circle-fill me-2"></i>Test Single Prediction
                </button>
            </div>
        </div>

        <!-- Result Section -->
        <div id="resultSection" class="d-none animate__animated animate__fadeInUp">
            <div class="row g-4 mb-4">
                <div class="col-md-4">
                    <div class="card-modern p-4 text-center h-100">
                        <p class="text-muted fw-bold small mb-2">Rows Processed</p>
                        <div class="stat-value" id="statTotalRows">0</div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card-modern p-4 text-center h-100 border-success border-2">
                        <p class="text-muted fw-bold small mb-2 text-success">Data Quality Match</p>
                        <div class="stat-value text-success" id="statMatch">0%</div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card-modern p-4 text-center h-100">
                        <p class="text-muted fw-bold small mb-2" id="statInsightLabel">Insight</p>
                        <div class="stat-value text-warning" id="statInsightValue" style="font-size: 2rem;">-</div>
                    </div>
                </div>
            </div>

            <div class="row g-4 mb-4" id="chartActionRow">
                <div class="col-lg-8">
                    <div class="card-modern p-4 h-100">
                        <div id="predictionChart" style="height: 300px;"></div>
                    </div>
                </div>
                <div class="col-lg-4">
                    <div class="card-modern p-0 h-100 d-flex flex-column overflow-hidden border-success border-2">
                        <div
                            class="bg-success text-white p-4 text-center flex-grow-1 d-flex flex-column justify-content-center">
                            <i class="bi bi-check-circle-fill display-4 mb-3"></i>
                            <h4 class="fw-bold mb-0">Success!</h4>
                        </div>
                        <button id="dlResultBtn" class="btn btn-light rounded-0 py-3 fw-bold text-success w-100"><i
                                class="bi bi-download me-2"></i> Download Result CSV</button>
                    </div>
                </div>
            </div>

            <div class="card-modern p-4">
                <div class="table-responsive rounded-3 border">
                    <table class="table table-sm table-hover mb-0" id="resultTable">
                        <thead>
                            <tr>
                                <th class="p-3 text-center text-muted">Processing...</th>
                            </tr>
                        </thead>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- ✅ เปลี่ยนจาก script.js เป็น main.js ตามไฟล์จริงที่เราใช้ -->
    <script src="script.js"></script>

</body>

</html>
